<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BP AI Portal</title>
    <meta name="description" content="Glucose analysis with meals/activity context" />
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Noto Sans, "Apple Color Emoji", "Segoe UI Emoji"; }
      .container { max-width: 960px; margin: 0 auto; padding: 24px; }
      .card { border: 1px solid #e5e7eb22; border-radius: 12px; padding: 16px; background: color-mix(in oklab, Canvas 92%, transparent); }
      .btn { padding: 10px 16px; border-radius: 10px; border: 1px solid #e5e7eb55; background: #3b82f6; color: white; cursor: pointer; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .btn-outline { background: transparent; color: inherit; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .muted { color: #6b7280; }
      .input { padding: 8px 12px; border: 1px solid #e5e7eb55; border-radius: 8px; width: 100%; }
      .grid { display: grid; gap: 16px; }
      @media (min-width: 768px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
      pre { white-space: pre-wrap; font-size: 0.95rem; }
      .alert { border: 2px solid #ef4444; background: color-mix(in oklab, #ef4444 15%, transparent); padding: 12px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  </html>
